<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">

    <title>Preflight</title>
    <style id="theme-vars">
/* mcoder UI Redesign v2 - Brand CSS
   Inspired by Tokyo Night palette, refined for agent orchestration tool.
   Research-backed: medium-dark bg (not pure black), low-saturation accents,
   JetBrains Mono for code, Inter for UI.
*/

/* ===== Raw Token Scale ===== */
:root {
  /* Brand primary (single hue: blue) */
  --mc-brand-50: #a9c7ff;
  --mc-brand-100: #89b4fa;
  --mc-brand-200: #7aa2f7;
  --mc-brand-300: #6b91f4;
  --mc-brand-400: #5c80f1;
  --mc-brand-500: #4d6fee;
  --mc-brand-600: #3e5eeb;
  --mc-brand-700: #2f4de8;
  --mc-brand-800: #203ce5;
  --mc-brand-900: #112be2;
  --mc-brand-950: #021adf;

  /* Neutral scale (Tokyo Night surfaces) */
  --mc-neutral-0: #16161e;
  --mc-neutral-50: #1a1b26;
  --mc-neutral-100: #1f2335;
  --mc-neutral-200: #292e42;
  --mc-neutral-300: #3b4261;
  --mc-neutral-400: #565f89;
  --mc-neutral-500: #6b7394;
  --mc-neutral-600: #8289ad;
  --mc-neutral-700: #9aa5ce;
  --mc-neutral-800: #b4bdf0;
  --mc-neutral-900: #c0caf5;
  --mc-neutral-950: #d4dffb;

  /* State colors (semantic only) */
  --mc-state-success: #9ece6a;
  --mc-state-success-dim: rgba(158, 206, 106, 0.12);
  --mc-state-warning: #e0af68;
  --mc-state-warning-dim: rgba(224, 175, 104, 0.12);
  --mc-state-error: #f7768e;
  --mc-state-error-dim: rgba(247, 118, 142, 0.12);
  --mc-state-info: #7dcfff;
  --mc-state-info-dim: rgba(125, 207, 255, 0.12);
  --mc-state-mauve: #bb9af7;
  --mc-state-mauve-dim: rgba(187, 154, 247, 0.12);
  --mc-state-orange: #ff9e64;
  --mc-state-orange-dim: rgba(255, 158, 100, 0.12);
}

/* ===== Semantic Aliases (required by head contract) ===== */
:root {
  --mc-background: #1a1b26;
  --mc-foreground: #c0caf5;
  --mc-card: #16161e;
  --mc-card-foreground: #c0caf5;
  --mc-popover: #292e42;
  --mc-popover-foreground: #c0caf5;
  --mc-primary: #7aa2f7;
  --mc-primary-foreground: #16161e;
  --mc-secondary: #292e42;
  --mc-secondary-foreground: #c0caf5;
  --mc-muted: #1f2335;
  --mc-muted-foreground: #565f89;
  --mc-accent: #7aa2f7;
  --mc-accent-foreground: #16161e;
  --mc-destructive: #f7768e;
  --mc-destructive-foreground: #16161e;
  --mc-border: #292e42;
  --mc-input: #292e42;
  --mc-ring: #7aa2f7;
  --mc-radius-small: 4px;
  --mc-radius-medium: 8px;
  --mc-radius-large: 12px;
}

/* ===== Dark mode (default) ===== */
html.dark {
  --mc-background: #1a1b26;
  --mc-foreground: #c0caf5;
  --mc-card: #16161e;
  --mc-card-foreground: #c0caf5;
  --mc-popover: #292e42;
  --mc-popover-foreground: #c0caf5;
  --mc-primary: #7aa2f7;
  --mc-primary-foreground: #16161e;
  --mc-secondary: #292e42;
  --mc-secondary-foreground: #c0caf5;
  --mc-muted: #1f2335;
  --mc-muted-foreground: #565f89;
  --mc-accent: #7aa2f7;
  --mc-accent-foreground: #16161e;
  --mc-destructive: #f7768e;
  --mc-destructive-foreground: #16161e;
  --mc-border: #292e42;
  --mc-input: #292e42;
  --mc-ring: #7aa2f7;
}

/* ===== Typography ===== */
:root {
  --mc-font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --mc-font-mono: 'JetBrains Mono', 'SF Mono', 'Menlo', 'Monaco', 'Cascadia Code', monospace;
  --mc-font-display: var(--mc-font-sans);
}

/* ===== Radius Scale (restrained) ===== */
:root {
  --mc-radius-xs: 2px;
  --mc-radius-sm: 4px;
  --mc-radius-md: 8px;
  --mc-radius-lg: 12px;
}

/* ===== Shadow Scale (subtle, border-first) ===== */
:root {
  --mc-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.03);
  --mc-shadow-2: 0 8px 24px -8px rgba(0, 0, 0, 0.12);
  --mc-shadow-3: 0 24px 60px -20px rgba(0, 0, 0, 0.20);
}

/* ===== Spacing Scale (8pt grid) ===== */
:root {
  --mc-space-1: 4px;
  --mc-space-2: 8px;
  --mc-space-3: 12px;
  --mc-space-4: 16px;
  --mc-space-5: 24px;
  --mc-space-6: 32px;
  --mc-space-7: 48px;
  --mc-space-8: 80px;
}

/* ===== Transition ===== */
:root {
  --mc-transition-fast: 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
  --mc-transition: 160ms cubic-bezier(0.2, 0.8, 0.2, 1);
  --mc-transition-slow: 240ms cubic-bezier(0.3, 0, 0, 1);
}

  }
